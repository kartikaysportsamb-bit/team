<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Design Agency | Phenomenon</title>
<meta name="description" content="Partner with a digital product design agency focused on startup growth, UX, and scalable solutions.">

<style>
/* ===== Global ===== */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #4B0082, #00008B);
    color: #666;
}
h1, h2 {
    color: #000;
}
.container {
    width: 90%;
    max-width: 1200px;
    margin: auto;
}
section {
    padding: 80px 0;
}
a {
    text-decoration: none;
    color: inherit;
}
.btn {
    padding: 14px 28px;
    background: #fff;
    color: #000;
    border-radius: 30px;
    font-weight: bold;
    display: inline-block;
}

/* ===== Header ===== */
header {
    position: fixed;
    width: 100%;
    z-index: 10;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
}
header .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 0;
}
header ul {
    display: flex;
    gap: 30px;
    list-style: none;
}

/* ===== Hero Video ===== */
.hero-video {
    position: relative;
    height: 100vh;
    overflow: hidden;
}
.hero-video video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.hero-video::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
}
.hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    color: #fff;
    top: 35%;
}
.hero-content h1 {
    font-size: 48px;
    color: #fff;
}
.hero-content p {
    font-size: 20px;
    margin-bottom: 30px;
}

/* ===== Video Grid ===== */
.video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 30px;
}
.video-grid video {
    width: 100%;
    border-radius: 18px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

/* ===== Footer ===== */
footer {
    background: #000;
    color: #aaa;
    padding: 40px 0;
    text-align: center;
}
</style>
</head>

<body>

<header>
    <div class="container nav">
        <strong style="color:#fff;">Phenomenon</strong>
        <ul>
            <li><a href="#">Services</a></li>
            <li><a href="#">Cases</a></li>
            <li><a href="#">Company</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </div>
</header>

<!-- HERO VIDEO -->
<section class="hero-video">
    <video autoplay muted loop playsinline>
        <source src="/mnt/data/top-page-video.mp4" type="video/mp4">
    </video>

    <div class="hero-content">
        <h1>We design digital products that scale</h1>
        <p>UX • UI • Product Strategy</p>
        <a href="#" class="btn">Start a project</a>
    </div>
</section>

<!-- SHOWCASE VIDEOS -->
<section style="background:#f5f5f5;">
    <div class="container">
        <h2 style="text-align:center;">Our work in motion</h2>

        <div class="video-grid">
            <video autoplay muted loop playsinline>
                <source src="/mnt/data/bottom_video1.mp4" type="video/mp4">
            </video>

            <video autoplay muted loop playsinline>
                <source src="/mnt/data/bottom_video2.mp4" type="video/mp4">
            </video>
        </div>
    </div>
</section>

<!-- PROCESS VIDEO -->
<section>
    <div class="container">
        <h2 style="text-align:center;">How we build products</h2>

        <video controls style="width:100%; border-radius:20px;">
            <source src="/mnt/data/bottom_video1.mp4" type="video/mp4">
        </video>
    </div>
</section>

<footer>
    <p>Phenomenon © 2026 — All rights reserved</p>
</footer>

</body>
</html>
